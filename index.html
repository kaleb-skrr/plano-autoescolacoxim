<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Monte seu plano — Autoescola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Text:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --asphalt: #1B1E22;
    --asphalt-2: #24282D;
    --chalk: #F6F3EC;
    --chalk-dim: #E9E4D8;
    --line-yellow: #F4B400;
    --signal-orange: #E8592E;
    --go-green: #2E9E5B;
    --ink: #1B1E22;
    --mist: #8B9199;
    --mist-light: #B7BCC2;
    --hairline: rgba(27,30,34,0.12);
    --hairline-dark: rgba(255,255,255,0.14);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  a[href^="tel:"], a[href^="mailto:"], a[href^="sms:"]{ color:inherit !important; text-decoration:none !important; }
  body{ background:var(--chalk); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .display{ font-family:'Big Shoulders Stencil Text', sans-serif; font-weight:900; letter-spacing:0.02em; }

  .hero{ background:#FFFFFF; color:var(--ink); padding:56px 24px 64px; position:relative; overflow:hidden; border-bottom:1px solid var(--hairline); }
  .hero-inner{max-width:760px;margin:0 auto;}
  .eyebrow{ text-transform:uppercase; font-size:12px; letter-spacing:0.16em; color:var(--signal-orange); font-weight:600; margin:0 0 10px; }
  h1.display{ font-size:clamp(34px, 6vw, 56px); line-height:0.95; margin:0 0 14px; text-transform:uppercase; }
  .hero-logo{ max-width:300px; max-height:130px; width:auto; height:auto; margin:0 0 18px; display:block; }
  .hero p{ color:var(--mist); font-size:15px; line-height:1.45; max-width:46ch; margin:0; }
  @media (max-width:480px){ .hero{ padding:40px 20px 52px; } .hero-logo{ max-width:220px; max-height:100px; } }

  .dark-zone{ background:var(--asphalt); padding-bottom:4px; }
  .dark-zone::before{ content:""; display:block; height:6px;
    background:repeating-linear-gradient(90deg, var(--line-yellow) 0 26px, transparent 26px 46px); opacity:0.9; }

  .road-wrap{ max-width:760px; margin:0 auto; padding:28px 24px 4px; }
  .road{ position:relative; height:52px; }
  .road-track{ position:absolute; left:0; right:0; top:24px; height:4px; background:var(--hairline-dark); border-radius:2px; }
  .road-track-fill{ position:absolute; left:0; top:24px; height:4px; background:var(--line-yellow); border-radius:2px; transition:width .4s ease; }
  .road-checkpoints{ position:absolute; left:0; right:0; top:16px; display:flex; justify-content:space-between; }
  .checkpoint{ width:20px; height:20px; border-radius:50%; background:var(--asphalt-2); border:3px solid var(--hairline-dark); z-index:1; transition:all .25s ease; }
  .checkpoint.done{ border-color:var(--line-yellow); background:var(--line-yellow); }
  .checkpoint.active{ border-color:var(--signal-orange); background:var(--asphalt-2); box-shadow:0 0 0 4px rgba(232,89,46,0.2); }
  .car-marker{ position:absolute; top:-2px; transform:translateX(-50%); font-size:22px; transition:left .4s ease; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.35)); }
  .step-label{ max-width:760px; margin:0 auto; padding:0 24px; font-size:13px; color:var(--mist-light); font-weight:500; }

  main{ max-width:760px; margin:0 auto; padding:20px 24px 80px; }
  .card{ background:var(--asphalt); border:1px solid var(--hairline-dark); border-radius:var(--radius); padding:28px; }
  .question{ font-size:clamp(20px,3.4vw,26px); font-weight:600; margin:0 0 4px; color:var(--chalk); }
  .question-sub{ color:var(--mist-light); font-size:14px; margin:0 0 22px; }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 18px;
    border:2px solid var(--hairline-dark); border-radius:10px; cursor:pointer; background:var(--asphalt-2); text-align:left;
    transition:border-color .15s ease, background .15s ease; font-family:inherit; }
  .option:hover{ border-color:var(--signal-orange); }
  .option.selected{ border-color:var(--go-green); background:rgba(46,158,91,0.16); }
  .option-text strong{ display:block; font-size:15.5px; font-weight:600; color:var(--chalk); }
  .option-text span{ display:block; font-size:13px; color:var(--mist-light); margin-top:2px; }
  .option-price{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:14.5px; white-space:nowrap; color:var(--chalk); }
  .option-price.zero{ color:var(--mist-light); }

  .compare-grid{ display:flex; gap:14px; }
  .compare-col{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .compare-col h4{ margin:0 0 2px; font-size:14px; font-weight:600; color:var(--mist-light); line-height:1.3; }
  .compare-option{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px;
    border:2px solid var(--hairline-dark); border-radius:9px; cursor:pointer; background:var(--asphalt-2); text-align:left;
    transition:border-color .15s ease, background .15s ease; font-family:inherit; width:100%; }
  .compare-option:hover{ border-color:var(--signal-orange); }
  .compare-option.selected{ border-color:var(--go-green); background:rgba(46,158,91,0.16); }
  .compare-option .co-label{ font-size:13px; font-weight:500; color:var(--chalk); }
  .compare-option .co-price{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:13.5px; white-space:nowrap; color:var(--chalk); }
  @media (max-width:520px){ .compare-grid{ flex-direction:column; } }

  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:26px; }
  button.signbtn{ font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:14px; border-radius:8px;
    padding:12px 22px; border:none; cursor:pointer; transition:opacity .15s ease, transform .1s ease; }
  button.signbtn:active{ transform:scale(0.97); }
  button.signbtn:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-back{ background:transparent; color:var(--mist-light); }
  .btn-next{ background:var(--line-yellow); color:var(--asphalt); }
  .btn-next.finish{ background:var(--go-green); color:#fff; }

  .result-head{ text-align:center; margin-bottom:22px; }
  .result-head .eyebrow2{ text-transform:uppercase; letter-spacing:0.14em; font-size:12px; color:var(--go-green); font-weight:600; margin:0 0 8px; }
  .odometer{ background:var(--asphalt); color:var(--line-yellow); border-radius:10px; padding:22px 18px; text-align:center; margin-bottom:24px; }
  .odometer .label{ font-family:'IBM Plex Sans', sans-serif; color:var(--chalk-dim); font-size:12px; text-transform:uppercase; letter-spacing:0.12em; margin-bottom:8px; }
  .odometer .digits{ font-family:'IBM Plex Mono', monospace; font-size:clamp(32px, 7vw, 46px); font-weight:600; letter-spacing:0.02em; }

  .category-line{ font-size:14px; font-weight:600; color:var(--line-yellow); margin:0 0 14px; }

  .receipt{ border-top:1px dashed var(--hairline-dark); padding-top:6px; }
  .receipt-row{ display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px dashed var(--hairline-dark); font-size:14.5px; }
  .receipt-row:last-child{ border-bottom:none; }
  .receipt-row .item-label{ color:var(--chalk); font-weight:600; }
  .receipt-row .item-sub{ display:block; color:var(--mist-light); font-size:12.5px; font-weight:400; margin-top:2px; }
  .receipt-row .item-price{ font-family:'IBM Plex Mono', monospace; font-weight:600; white-space:nowrap; color:var(--chalk); }
  .receipt-note{ background:#FFF6E8; border:1px solid #F0DBAA; border-radius:8px; padding:12px 14px; font-size:12.5px; color:#7A5A17; margin-top:14px; line-height:1.5; }

  .exames-box{ background:var(--chalk); border:1px solid var(--hairline); border-radius:9px; padding:14px 16px; margin-top:12px; }
  .exames-box .exames-title{ font-weight:600; font-size:14.5px; margin:0 0 8px; color:var(--ink); }
  .exame-line{ font-size:13px; color:var(--mist); padding:2px 0; }
  .exame-line strong{ color:var(--ink); font-weight:600; }
  .exames-total-line{ font-size:13px; color:var(--ink); padding:6px 0 0; margin-top:6px; border-top:1px dashed var(--hairline); font-weight:600; }

  .action-row{ margin-top:24px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .btn-copy{ background:var(--go-green); color:#fff; border:none; padding:13px 26px; border-radius:8px;
    font-weight:600; cursor:pointer; font-family:inherit; font-size:14px; width:100%; transition:opacity .15s ease, transform .1s ease; }
  .btn-copy:active{ transform:scale(0.98); }
  .btn-copy.copied{ background:var(--asphalt); }
  .btn-restart{ background:transparent; border:2px solid var(--hairline-dark); color:var(--chalk); padding:12px 26px;
    border-radius:8px; font-weight:600; cursor:pointer; font-family:inherit; font-size:14px; width:100%; }

  @media (max-width:480px){ .card{ padding:20px; } .option{ padding:14px; } }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <p class="eyebrow">Simulador de plano</p>
    <img class="hero-logo" src="logo.png" alt="Logo da autoescola">
    <p>Responda algumas perguntas e veja na hora o valor do seu plano.</p>
  </div>
</div>

<div class="dark-zone">
<div class="road-wrap">
  <div class="road">
    <div class="road-track"></div>
    <div class="road-track-fill" id="trackFill"></div>
    <div class="road-checkpoints" id="checkpoints"></div>
    <div class="car-marker" id="carMarker">🚗</div>
  </div>
</div>
<p class="step-label" id="stepLabel">Etapa 1</p>

<main>
  <div class="card" id="card"></div>
</main>
</div>

<script>
/* ---------- DADOS BASE (ATUALIZE OS VALORES AQUI) ---------- */

const DETRAN = [
  { id:'impDig', label:'CNH impressa + digital', desc:'Documento físico e versão digital', value:642.43 },
  { id:'digital', label:'Somente CNH digital', desc:'Só a versão digital, sem o documento físico', value:502.03 },
];

const EXAMES_OBRIGATORIOS = [
  { label:'Exame psicológico', value:95.00 },
  { label:'Exame médico', value:85.00 },
  { label:'Exame toxicológico', value:120.00 },
];

const MOTOS = {
  factor: {
    label: 'Honda/Yamaha Factor 150',
    pacotes: [
      { id:'m2',  aulas:2,  label:'2 aulas + exame',  value:380 },
      { id:'m5',  aulas:5,  label:'5 aulas + exame',  value:540 },
      { id:'m10', aulas:10, label:'10 aulas + exame', value:900 },
    ]
  },
  biz: {
    label: 'Honda Biz 125',
    pacotes: [
      { id:'m2',  aulas:2,  label:'2 aulas + exame',  value:380 },
      { id:'m5',  aulas:5,  label:'5 aulas + exame',  value:510 },
      { id:'m10', aulas:10, label:'10 aulas + exame', value:850 },
    ]
  }
};

const CARROS = {
  gol: {
    label: 'Gol — câmbio manual',
    pacotes: [
      { id:'c2',  aulas:2,  label:'2 aulas + exame',  value:450 },
      { id:'c5',  aulas:5,  label:'5 aulas + exame',  value:740 },
      { id:'c10', aulas:10, label:'10 aulas + exame', value:1150 },
    ]
  },
  byd: {
    label: 'BYD Dolphin Mini — câmbio automático',
    pacotes: [
      { id:'c2',  aulas:2,  label:'2 aulas + exame',  value:520 },
      { id:'c5',  aulas:5,  label:'5 aulas + exame',  value:880 },
      { id:'c10', aulas:10, label:'10 aulas + exame', value:1290 }, // AJUSTAR: valor não informado ainda
    ]
  }
};

/* ---------- MONTAGEM DINÂMICA DAS ETAPAS ---------- */

function getSteps(answers){
  const s = [];

  s.push({
    id:'categoria',
    type:'single',
    question:'Qual categoria de CNH você quer tirar?',
    sub:'Isso define quais veículos vão aparecer nas próximas etapas.',
    options:[
      { id:'A',  label:'Categoria A — Motocicleta',  desc:'Somente moto', value:0 },
      { id:'B',  label:'Categoria B — Automóvel',     desc:'Somente carro', value:0 },
      { id:'AB', label:'Categoria AB — Moto + Carro', desc:'Processo combinado', value:0 },
    ]
  });

  if (answers.categoria === 'A' || answers.categoria === 'AB'){
    s.push({
      id:'motoEscolha',
      type:'compare',
      vKey:'veiculoMoto',
      pKey:'pacoteMoto',
      vehicleType:'moto',
      question:'Qual moto e pacote de aulas você quer?',
      sub:'Compare os preços dos dois modelos e escolha o pacote ideal.',
      groups: Object.keys(MOTOS).map(k => ({ key:k, label:MOTOS[k].label, options:MOTOS[k].pacotes }))
    });
  }

  if (answers.categoria === 'B' || answers.categoria === 'AB'){
    s.push({
      id:'carroEscolha',
      type:'compare',
      vKey:'veiculoCarro',
      pKey:'pacoteCarro',
      vehicleType:'carro',
      question:'Qual carro e pacote de aulas você quer?',
      sub:'Compare os preços dos dois modelos e escolha o pacote ideal.',
      groups: Object.keys(CARROS).map(k => ({ key:k, label:CARROS[k].label, options:CARROS[k].pacotes }))
    });
  }

  s.push({
    id:'cnhTipo',
    type:'single',
    question:'Como você quer receber sua CNH?',
    sub:'Taxa do Detran, obrigatória para todo o processo.',
    options: DETRAN
  });

  return s;
}

// Retorna { mainLabel, subLabel, value } de forma padronizada, já pensado pro texto final ser didático
function getSelected(step, answers){
  if (step.type === 'compare'){
    const groupKey = answers[step.vKey];
    if (!groupKey) return null;
    const group = step.groups.find(g => g.key === groupKey);
    const opt = group.options.find(o => o.id === answers[step.pKey]);
    if (!opt) return null;
    return {
      mainLabel: `${opt.aulas} aulas de ${step.vehicleType} + exame`,
      subLabel: `Modelo: ${group.label}`,
      value: opt.value
    };
  }
  const opt = step.options.find(o => o.id === answers[step.id]);
  if (!opt) return null;
  return { mainLabel: opt.label, subLabel: opt.desc || '', value: opt.value };
}

let answers = {};
let current = 0;
let finished = false;

function render(){
  const vSteps = getSteps(answers);
  if (finished){ renderResult(vSteps); return; }
  if (current >= vSteps.length){ current = vSteps.length - 1; }
  const step = vSteps[current];
  renderRoad(vSteps.length, current);
  document.getElementById('stepLabel').textContent = `Etapa ${current+1} de ${vSteps.length}`;

  let bodyHtml = '';
  if (step.type === 'compare'){
    bodyHtml = `<div class="compare-grid">` + step.groups.map(g => `
      <div class="compare-col">
        <h4>${g.label}</h4>
        ${g.options.map(o => `
          <button class="compare-option ${answers[step.vKey]===g.key && answers[step.pKey]===o.id ? 'selected':''}"
            data-gkey="${g.key}" data-oid="${o.id}">
            <span class="co-label">${o.label}</span>
            <span class="co-price">${formatBRL(o.value)}</span>
          </button>
        `).join('')}
      </div>
    `).join('') + `</div>`;
  } else {
    const selected = answers[step.id];
    bodyHtml = `<div class="options">` + step.options.map(o => `
      <button class="option ${selected===o.id ? 'selected':''}" data-opt="${o.id}">
        <span class="option-text">
          <strong>${o.label}</strong>
          <span>${o.desc || ''}</span>
        </span>
        <span class="option-price ${o.value===0?'zero':''}">${o.value===0 ? '' : formatBRL(o.value)}</span>
      </button>
    `).join('') + `</div>`;
  }

  const hasSelection = !!getSelected(step, answers);

  document.getElementById('card').innerHTML = `
    <p class="question">${step.question}</p>
    <p class="question-sub">${step.sub}</p>
    ${bodyHtml}
    <div class="nav-row">
      <button class="signbtn btn-back" id="backBtn" ${current===0 ? 'disabled':''}>← Voltar</button>
      <button class="signbtn ${current===vSteps.length-1 ? 'btn-next finish':'btn-next'}" id="nextBtn" ${!hasSelection ? 'disabled':''}>
        ${current===vSteps.length-1 ? 'Ver meu plano →' : 'Avançar →'}
      </button>
    </div>
  `;

  if (step.type === 'compare'){
    document.querySelectorAll('.compare-option').forEach(btn => {
      btn.addEventListener('click', () => {
        answers[step.vKey] = btn.getAttribute('data-gkey');
        answers[step.pKey] = btn.getAttribute('data-oid');
        render();
      });
    });
  } else {
    document.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => {
        answers[step.id] = btn.getAttribute('data-opt');
        if (step.id === 'categoria'){
          delete answers.veiculoMoto; delete answers.pacoteMoto;
          delete answers.veiculoCarro; delete answers.pacoteCarro;
        }
        render();
      });
    });
  }

  document.getElementById('backBtn').addEventListener('click', () => { if (current>0){ current-=1; render(); } });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (!getSelected(step, answers)) return;
    if (current === vSteps.length-1){ finished = true; render(); }
    else { current += 1; render(); }
  });
}

function renderRoad(total, activeIndex){
  const pct = total <= 1 ? 100 : (activeIndex/(total-1))*100;
  document.getElementById('trackFill').style.width = pct + '%';
  document.getElementById('carMarker').style.left = pct + '%';
  const cpWrap = document.getElementById('checkpoints');
  cpWrap.innerHTML = '';
  for (let i=0; i<total; i++){
    const cp = document.createElement('div');
    cp.className = 'checkpoint' + (i<activeIndex ? ' done' : i===activeIndex ? ' active' : '');
    cpWrap.appendChild(cp);
  }
}

function renderResult(vSteps){
  document.getElementById('stepLabel').textContent = 'Chegada 🏁';
  renderRoad(vSteps.length, vSteps.length);

  const categoriaStep = vSteps.find(s => s.id === 'categoria');
  const categoriaSel = getSelected(categoriaStep, answers);
  const otherSteps = vSteps.filter(s => s.id !== 'categoria');
  const items = otherSteps.map(step => getSelected(step, answers));

  const examesTotal = EXAMES_OBRIGATORIOS.reduce((sum,e) => sum + e.value, 0);
  const total = items.reduce((sum, it) => sum + it.value, 0) + examesTotal;

  const rowsHtml = items.map(it => `
    <div class="receipt-row">
      <span class="item-label">${it.mainLabel}<span class="item-sub">${it.subLabel}</span></span>
      <span class="item-price">${it.value===0 ? '—' : formatBRL(it.value)}</span>
    </div>
  `).join('');

  const examesLinesHtml = EXAMES_OBRIGATORIOS.map(e => `
    <div class="exame-line">${e.label} — <strong>${formatBRL(e.value)}</strong></div>
  `).join('');

  const examesBoxHtml = `
    <div class="exames-box">
      <p class="exames-title">Exames obrigatórios</p>
      ${examesLinesHtml}
      <div class="exames-total-line">Subtotal exames: ${formatBRL(examesTotal)}</div>
    </div>
  `;

  document.getElementById('card').innerHTML = `
    <div class="result-head">
      <p class="eyebrow2">Plano montado</p>
      <p class="question" style="margin-bottom:0;">Esse é o valor do seu plano</p>
    </div>
    <div class="odometer">
      <div class="label">Total do plano</div>
      <div class="digits" id="odoDigits">${formatBRL(0)}</div>
    </div>
    <p class="category-line">${categoriaSel.mainLabel}</p>
    <div class="receipt">
      ${rowsHtml}
    </div>
    ${examesBoxHtml}
    <div class="receipt-note">
      Os exames são obrigatórios por lei e pagos diretamente à clínica parceira — não são cobrados pela autoescola, mas fazem parte do valor total do plano.
    </div>
    <div class="action-row">
      <button class="btn-copy" id="copyBtn">📋 Copiar mensagem pro WhatsApp</button>
      <button class="btn-restart" id="restartBtn">Recomeçar simulação</button>
    </div>
  `;

  animateOdometer(total);

  document.getElementById('restartBtn').addEventListener('click', () => {
    answers = {}; current = 0; finished = false; render();
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    const msg = buildMessage(categoriaSel, items, examesTotal, total);
    copyToClipboard(msg, document.getElementById('copyBtn'));
  });
}

function buildMessage(categoriaSel, items, examesTotal, total){
  let lines = [];
  lines.push('Plano montado no simulador da autoescola:');
  lines.push('');
  lines.push(`Categoria: ${categoriaSel.mainLabel}`);
  items.forEach(it => {
    lines.push(`- ${it.mainLabel} (${it.subLabel.replace('Modelo: ','')}) — ${it.value===0 ? 'incluso' : formatBRL(it.value)}`);
  });
  lines.push('Exames obrigatórios (pagos à clínica):');
  EXAMES_OBRIGATORIOS.forEach(e => {
    lines.push(`- ${e.label} — ${formatBRL(e.value)}`);
  });
  lines.push(`Subtotal exames: ${formatBRL(examesTotal)}`);
  lines.push('');
  lines.push(`Total do plano: ${formatBRL(total)}`);
  return lines.join('\n');
}

function copyToClipboard(text, btn){
  const done = () => {
    const original = '📋 Copiar mensagem pro WhatsApp';
    btn.textContent = '✅ Copiado!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1800);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ /* falha silenciosa */ }
  document.body.removeChild(ta);
}

function animateOdometer(target){
  const el = document.getElementById('odoDigits');
  const duration = 600;
  const start = performance.now();
  function tick(now){
    const t = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = formatBRL(Math.round(target*eased*100)/100);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function formatBRL(v){
  return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}

render();
</script>
</body>
